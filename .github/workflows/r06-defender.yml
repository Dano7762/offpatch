# R-06 : Defender sur runner Windows 11 ARM64 jetable. Plateforme remise à celle de l'image (définitions conservées),
# puis, si un lien est donné, mise à jour de plateforme (KB4052623), puis mpam-fe.exe -q.
# Déclenchement manuel uniquement. Modifie le système du runner (Defender), sans redémarrage.
name: r06-defender

on:
  workflow_dispatch:
    inputs:
      platform_url_arm64:
        description: 'Lien de la mise à jour de plateforme ARM64 (updateplatform.arm64fre_*.exe), vide pour ne pas la tester'
        required: false
        default: ''
      remove_definitions:
        description: 'Supprimer aussi les définitions (MpCmdRun -RemoveDefinitions -All) avant la plateforme'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  defender:
    runs-on: windows-11-arm
    timeout-minutes: 60
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v5

      - name: Essai R-06
        env:
          PLATFORM_URL: ${{ inputs.platform_url_arm64 }}
          REMOVE_DEFINITIONS: ${{ inputs.remove_definitions }}
        run: ./tests/runner/Invoke-R06DefenderTest.ps1 -Arch arm64 -Variant Quiet -PlatformUrl $env:PLATFORM_URL -RemoveDefinitions:($env:REMOVE_DEFINITIONS -eq 'true') -OutputDirectory "$env:RUNNER_TEMP\r06-out"

      - name: Relevés
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: r06-defender-arm64
          path: ${{ runner.temp }}/r06-out
          retention-days: 30
          if-no-files-found: warn
