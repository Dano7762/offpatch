# R-08 : une clé de produit passée à l'ODT apparaît-elle dans ses journaux ? Installation LTSC 2024 avec une fausse
# clé de forme valide sur un runner Windows 11 ARM64 jetable, puis recherche de la clé dans les journaux produits.
# Déclenchement manuel uniquement. Modifie le système du runner (installation d'Office). Aucune clé réelle.
name: r08-keylog

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keylog:
    runs-on: windows-11-arm
    timeout-minutes: 120
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v5

      - name: Essai clé de produit et journaux ODT
        run: ./tests/runner/Invoke-R08KeyLogTest.ps1 -OutputDirectory "$env:RUNNER_TEMP\r08-key-out"

      - name: Relevés
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: r08-keylog
          path: ${{ runner.temp }}/r08-key-out
          retention-days: 30
          if-no-files-found: warn
