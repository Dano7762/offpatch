# Contrat avec le Microsoft Update Catalog en ligne (R-11) : les fonctions d'analyse reconnaissent-elles
# toujours les pages actuelles du site ? Lecture seule, quelques requêtes, aucun téléchargement de fichier.
# Chaque mercredi (lendemain du Patch Tuesday les semaines concernées) et à la demande.
name: catalog-contract

on:
  schedule:
    - cron: '0 6 * * 3'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contrat:
    runs-on: windows-2025
    timeout-minutes: 20
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v5

      - name: Pester (version figée)
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name Pester -RequiredVersion 5.9.1 -Scope CurrentUser -Force -SkipPublisherCheck

      - name: Contrat avec le Microsoft Update Catalog (en ligne)
        run: |
          Import-Module Pester -RequiredVersion 5.9.1
          $config = New-PesterConfiguration
          $config.Run.Path = './tests/Live'
          $config.Run.Exit = $true
          $config.Filter.Tag = 'Live'
          $config.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $config
