# R-02 : installation séquentielle d'une cumulative et de ses checkpoints sur un runner Windows 11 ARM64 jetable.
# Déclenchement manuel uniquement. Modifie le système du runner (DISM en ligne), sans redémarrage.
name: r02-arm64

on:
  workflow_dispatch:
    inputs:
      kb:
        description: 'KB de la cumulative cible (ex. KB5129195)'
        required: true
        default: 'KB5129195'

permissions:
  contents: read

jobs:
  r02:
    runs-on: windows-11-arm
    timeout-minutes: 300
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v5

      - name: Essai R-02 (méthode 1)
        env:
          TARGET_KB: ${{ inputs.kb }}
        run: ./tests/runner/Invoke-R02CheckpointTest.ps1 -Kb $env:TARGET_KB -Arch arm64 -OutputDirectory "$env:RUNNER_TEMP\r02-out"

      - name: Journaux DISM et relevés
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: r02-arm64-${{ inputs.kb }}
          path: ${{ runner.temp }}/r02-out
          retention-days: 30
          if-no-files-found: warn
